<svg xmlns="http://www.w3.org/2000/svg" width="2842" height="1132" viewBox="0 0 2842 1132" fill="none">
  <defs>
    <!-- Soft warm radial glow at top-center -->
    <radialGradient id="chaiGlow" cx="50%" cy="0%" r="65%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.14" />
      <stop offset="25%" stop-color="#d97706" stop-opacity="0.08" />
      <stop offset="55%" stop-color="#b45309" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <!-- Hexagon pattern -->
    <pattern id="hexGrid" width="56" height="97" patternUnits="userSpaceOnUse" patternTransform="scale(1)">
      <path d="M28 0 L56 16.17 L56 48.5 L28 64.67 L0 48.5 L0 16.17 Z M28 97 L56 80.83 L56 48.5 L28 32.33 L0 48.5 L0 80.83 Z" fill="none" stroke="#ffedd5" stroke-opacity="0.035" stroke-width="0.8" />
    </pattern>
    <radialGradient id="hexMaskGradient" cx="50%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <mask id="hexMask">
      <rect width="2842" height="1132" fill="url(#hexMaskGradient)" />
    </mask>
  </defs>

  <!-- Main amber/warm ambient glow -->
  <rect width="2842" height="1132" fill="url(#chaiGlow)" />

  <!-- Subtle hexagon grid overlay masked by top glow -->
  <rect width="2842" height="1132" fill="url(#hexGrid)" mask="url(#hexMask)" />
</svg>
