AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ClipSync Serverless Infrastructure - End-to-End Encrypted Browser-Based Clipboard Sync

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment stage environment

Globals:
  Function:
    Timeout: 10
    MemorySize: 512
    Architectures:
      - arm64

Resources:
  # ============================================================================
  # 1. DynamoDB Tables (Always-Free Pool: Provisioned 1 RCU / 1 WCU, 0 GSIs)
  # ============================================================================
  RegistryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ClipSyncRegistry
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ClipboardTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ClipSyncClipboard
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ============================================================================
  # 2. CloudWatch Log Groups (Retention strictly 7 days to preserve $0.00 cost)
  # ============================================================================
  WebSocketFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-WebSocketHandler"
      RetentionInDays: 7

  ApiGatewayAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AWS::StackName}-WebSocketApi"
      RetentionInDays: 7

  # ============================================================================
  # 3. Consolidated Lambda Handler (DEC-009)
  # ============================================================================
  WebSocketFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - WebSocketFunctionLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-WebSocketHandler"
      CodeUri: ../backend
      Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
      Runtime: java21
      # Note: ReservedConcurrentExecutions removed — account concurrency quota is 10
      # and AWS requires all 10 to remain unreserved. Cost is braked by API Gateway
      # stage throttling (10 rps / 20 burst) per DEC-013.
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: clipSyncWebSocketHandler
          CLIPSYNC_DYNAMODB_TABLE_REGISTRY: !Ref RegistryTable
          CLIPSYNC_DYNAMODB_TABLE_CLIPBOARD: !Ref ClipboardTable
          CLIPSYNC_AWS_REGION: !Ref "AWS::Region"
          CLIPSYNC_APIGATEWAY_ENDPOINT: !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RegistryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ClipboardTable
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource:
                - !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  # ============================================================================
  # 4. API Gateway WebSocket API & Routes
  # ============================================================================
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-WebSocketApi"
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WebSocketIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketFunction.Arn}/invocations"

  # Core Routes
  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "$connect"
      AuthorizationType: NONE
      Target: !Sub "integrations/${WebSocketIntegration}"

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "$disconnect"
      AuthorizationType: NONE
      Target: !Sub "integrations/${WebSocketIntegration}"

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "$default"
      AuthorizationType: NONE
      Target: !Sub "integrations/${WebSocketIntegration}"

  # Custom Protocol Routes
  SessionCreateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "session.create"
      AuthorizationType: NONE
      Target: !Sub "integrations/${WebSocketIntegration}"

  SessionJoinRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "session.join"
      AuthorizationType: NONE
      Target: !Sub "integrations/${WebSocketIntegration}"

  ClipboardUpdateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "clipboard.update"
      AuthorizationType: NONE
      Target: !Sub "integrations/${WebSocketIntegration}"

  ClipboardReadRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "clipboard.read"
      AuthorizationType: NONE
      Target: !Sub "integrations/${WebSocketIntegration}"

  SignalingOfferRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "signaling.offer"
      AuthorizationType: NONE
      Target: !Sub "integrations/${WebSocketIntegration}"

  SignalingAnswerRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "signaling.answer"
      AuthorizationType: NONE
      Target: !Sub "integrations/${WebSocketIntegration}"

  SignalingIceRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: "signaling.ice"
      AuthorizationType: NONE
      Target: !Sub "integrations/${WebSocketIntegration}"

  # API Gateway Stage with Active Throttling Cost Brake (DEC-013)
  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: !Ref Environment
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      AccessLogSettings:
        DestinationArn: !GetAtt ApiGatewayAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","caller":"$context.identity.caller","user":"$context.identity.user","requestTime":"$context.requestTime","eventType":"$context.eventType","routeKey":"$context.routeKey","status":"$context.status","connectionId":"$context.connectionId"}'

  WebSocketLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

# ==============================================================================
# Outputs
# ==============================================================================
Outputs:
  WebSocketURL:
    Description: API Gateway WebSocket WSS Endpoint URL
    Value: !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "${AWS::StackName}-WebSocketURL"

  RegistryTableName:
    Description: Registry DynamoDB Table Name
    Value: !Ref RegistryTable

  ClipboardTableName:
    Description: Clipboard DynamoDB Table Name
    Value: !Ref ClipboardTable

  WebSocketFunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt WebSocketFunction.Arn
